name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x. Trusted publishing needs 11.5.1 or newer, and
      # without it npm falls back to looking for a token that is no longer set.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A tag that disagrees with package.json would quietly publish the
      # version in the file, not the one in the tag.
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - name: Refuse to republish an existing version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if npm view "clap-ts@$pkg" version >/dev/null 2>&1; then
            echo "clap-ts@$pkg is already on npm"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Typecheck the README examples
        run: bun run check:readme

      - name: Check the published artifact
        run: bun run check:package

      # No token: npm trades the GitHub OIDC identity for a short-lived
      # credential, and generates the provenance attestation itself, so
      # --provenance is no longer passed explicitly.
      - name: Publish to npm
        run: npm publish --access public
